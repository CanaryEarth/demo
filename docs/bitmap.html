	<body>

				</div>
			</div>
			<div class="preview">
				<canvas id="preview-canvas" width="800" height="480"></canvas>
				<div class="slider-container">
					<input type="range" id="threshold-slider" min="0" max="255" value="166" class="slider">

				</div>
			</div>
		</div>
		<script>
